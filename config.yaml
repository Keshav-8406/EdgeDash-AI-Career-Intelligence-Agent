# EdgeDash — user configuration
# Edit this file to match your profile. Nothing here is committed with secrets.
# See edgedash/config.py for the full list of supported fields and defaults.

# ---------------------------------------------------------------------------
# Career Profile
# ---------------------------------------------------------------------------

# The role title you are targeting (used in job searches and scoring).
target_role: "Security Engineer"

# Target seniority band.
target_seniority: "mid"

# City used to filter listings geographically.
target_city: "Berlin"
target_city: "Bangalore"
target_city: "Pune"
target_city: "Hyderabad"
target_city: "Indore"
target_city: "Mumbai"
target_city: "Chennai"
target_city: "Delhi NCR"
target_city: "Gurugram"
target_city: "Chandigarh"
target_city: "Ahmedabad"

# Additional keywords injected into every search query.
keywords:
  - "Security"
  - "SQL"
  - "Python"
  - "Power BI"
  - "Tableau"
  - "data pipeline"

# Your current skill set — the Scorer and GapAnalyzer compare listings against this.
my_skills:
  - "Security"
  - "JavaScript"
  - "Java"
  - "Python"
  - "SQL"
  - "HTML"
  - "C"
  - "C++"
  - "Perl"
  - "Excel"
  - "Pandas"
  - "Matplotlib"
  - "Statistics"

# Years of relevant experience.
experience_years: 2


# ---------------------------------------------------------------------------
# Database
# ---------------------------------------------------------------------------

# Path to the SQLite database file.
db_path: "edgedash.db"


# ---------------------------------------------------------------------------
# Job Sources
# ---------------------------------------------------------------------------

# Which job sources to query.
sources:
  - arbeitnow
  #- Linkedin
  #- Naukri Job Search

# Set to true to use MockFetcher instead of the real Fetcher.
use_mock_fetcher: false


# ---------------------------------------------------------------------------
# Scoring
# ---------------------------------------------------------------------------

# Listings with a fit score below this threshold are hidden from the dashboard.
min_fit_score: 60

# Maximum number of listings scored in one scoring run.
# Class 3 assignment requirement: configurable batch cap, default 25.
score_batch_size: 25


# ---------------------------------------------------------------------------
# LLM Configuration
# ---------------------------------------------------------------------------

# LLM provider used by EdgeDash.
llm_provider: "ollama"

# Ollama model used for LLM-powered job-description extraction.
llm_model: "gemma3:1b"

# Maximum number of listings processed in one LLM batch.
llm_batch_size: 10


# ---------------------------------------------------------------------------
# Skill Alias Map
# ---------------------------------------------------------------------------
# THIS MAP IS YOURS TO EDIT.
# Adding entries is expected as you see your own data — run
#   python -m edgedash.skills --audit
# to discover collisions worth aliasing.
#
# Format:  "raw variant": "canonical form"
# All keys and values are lowercased before lookup, so casing here
# does not matter.  The canonical form is what appears in gap reports
# and on the dashboard.
#
# Rule 23: skill names are canonicalised through this map only.
# The model never merges skill names by judgement or string similarity.

skill_aliases:
  # Kubernetes
  "k8s": "kubernetes"

  # Node / JavaScript  — kept SEPARATE, they are different skills
  "node":    "node.js"
  "nodejs":  "node.js"
  "node js": "node.js"

  # Postgres
  "postgresql": "postgres"
  "psql":       "postgres"

  # GCP
  "google cloud":          "gcp"
  "google cloud platform": "gcp"

  # Machine Learning
  "ml": "machine learning"

  # CI/CD
  "ci cd":  "ci/cd"
  "cicd":   "ci/cd"
  "ci-cd":  "ci/cd"

  # User additions from skill audit
  "data pipelines":    "data pipeline"
  "ci/cd pipelines":   "ci/cd"
  "strong sql skills": "sql"


# ---------------------------------------------------------------------------
# Orchestration / Planning Thresholds
# ---------------------------------------------------------------------------
# These values are the stop-conditions the Orchestrator passes to each
# sub-agent (rule 29).  Sub-agents never set their own limits.

# Re-fetch if this many hours have elapsed since the last successful fetch.
fetch_interval_hours: 6

# Fetcher stop-conditions.
fetch_max_pages: 10
fetch_max_listings: 200

# Maximum wall-clock seconds the Scorer may run in one cycle.
score_max_seconds: 300

# Maximum wall-clock seconds the GapAnalyzer may run in one cycle.
analyse_max_seconds: 120


# ---------------------------------------------------------------------------
# Verification Thresholds  (rule 39)
# Every threshold has a comment naming the failure it is designed to catch.
# ---------------------------------------------------------------------------

# check_score_spread — catches score inflation / all-same-score output.
# A run where every score is within a 10-point band is suspect (rule 20).
min_score_spread: 10

# check_score_spread — catches score clustering around a single value.
# A standard deviation below 5 means the model is returning near-identical
# scores regardless of listing content.
min_score_stdev: 5.0

# check_extraction_sanity — catches a broken extractor returning no skills.
# If more than 20% of listings have an empty required_skills list, something
# is wrong with the extraction prompt or model response parsing.
max_empty_extraction_pct: 20.0

# check_extraction_sanity — catches a model that returned a full sentence
# as a single skill entry (e.g. "experience with cloud platforms required").
# A real skill name never needs more than ~20 tokens.
max_skills_per_listing: 20

# check_gap_sample_size — catches ranking a gap based on a single listing.
# A gap computed from fewer than 3 listings is low-confidence and must not
# be promoted to the top rank.
min_gap_sample: 3

# check_freshness — catches stale data being presented as current.
# If the newest listing is older than 3 days, the fetch cycle has likely
# been broken or skipped for an extended period.
max_data_age_days: 3
